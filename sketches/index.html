<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sketchbook — Yassine Alouini</title>
<meta name="description" content="A sketchbook of drawings and the colors found in them.">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="sketches.css?v=shared-navigation-8">
<link rel="stylesheet" href="/assets/site-navigation.css?v=1">
<script src="sketches.js?v=minimal-4" defer></script>
<script src="../assets/painting-cat.js?v=2" defer></script>
</head>
<body>
<header class="site-header">
  <a class="site-home" href="/" aria-label="Home — Yassine Alouini">Yassine Alouini</a>
  <nav aria-label="Main navigation"><a href="/">Home</a><a href="/blog/">Blog</a><a href="/sketches/" aria-current="page">Sketchbook</a><a href="https://github.com/yassineAlouini">GitHub</a></nav>
</header>
<main>
  <section class="gallery" aria-label="Sketch carousel" aria-roledescription="carousel" tabindex="0">
    <figure class="sketch"><div class="sketch-stage"><img id="sketch-image" alt="" width="1000" height="620"></div><figcaption><h2 id="sketch-title"></h2><div class="carousel-controls"><button id="previous" type="button" aria-label="Previous sketch">←</button><button id="next" type="button" aria-label="Next sketch">→</button></div></figcaption></figure>
    <div class="sketchbook-bottom">
      <div id="palette" class="palette" aria-label="Extracted color palette"></div>
      <div class="painting-cat">
        <picture>
          <source srcset="../assets/painting-cat.gif" media="(prefers-reduced-motion: no-preference)">
          <img id="painting-cat" src="../assets/painting-cat.png" width="256" height="192" alt="A pixel-art cat in an ochre apron painting a coastline at an easel.">
        </picture>
      </div>
    </div>
  </section>
  <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
  <noscript><p>Enable JavaScript to view sketches and extract palettes.</p></noscript>
</main>
</body>
</html>
